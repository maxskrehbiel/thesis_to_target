[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "thesis_to_target"
version = "0.1.0"
description = "Turn an investment thesis into a ranked, evidence-backed list of private-company targets."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Maxwell Krehbiel" },
]
keywords = [
    "entity-resolution",
    "deal-sourcing",
    "private-equity",
    "evidence",
    "synthetic-data",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.8",
    "types-PyYAML>=6.0",
]

[project.scripts]
thesis_to_target = "thesis_to_target.cli:main"

[project.urls]
Homepage = "https://github.com/maxskrehbiel/thesis_to_target"
Repository = "https://github.com/maxskrehbiel/thesis_to_target"
Issues = "https://github.com/maxskrehbiel/thesis_to_target/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_to_target"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PTH"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs network or external software; run with `pytest -m integration`",
]

[tool.coverage.run]
source = ["thesis_to_target"]
branch = true

[tool.coverage.report]
show_missing = true
